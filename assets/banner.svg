<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="100%" height="100%">
  <defs>
    <!-- Apple Minimal Dot Matrix (Zero Green, Zero Neon) -->
    <pattern id="appleDotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#262629" />
    </pattern>

    <!-- Japanese Seigaiha / Sacred Ripple Pattern (Pure Solid Lines, Zero Gradient) -->
    <pattern id="seigaihaGrid" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 24 A 24 24 0 0 1 48 24 M 6 24 A 18 18 0 0 1 42 24 M 12 24 A 12 12 0 0 1 36 24 M 18 24 A 6 6 0 0 1 30 24" fill="none" stroke="#18181b" stroke-width="0.7" />
    </pattern>
  </defs>

  <style>
    /* GSAP Fluid Choreography (Power4.out / cubic-bezier(0.16, 1, 0.3, 1)) */
    @keyframes gsapFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes ensoBreathe {
      0%, 100% { opacity: 0.25; transform: scale(0.96); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .gsap-fade {
      animation: gsapFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .enso-breathe {
      animation: ensoBreathe 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 600px 170px;
    }
    .beacon {
      animation: beaconPulse 2.4s ease-in-out infinite;
    }

    /* Apple SF Pro Typography System */
    .apple-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.2px;
      fill: #86868b;
      text-transform: uppercase;
    }
    .apple-headline {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.8px;
      fill: #f5f5f7;
    }
    .apple-headline-silver {
      fill: #86868b;
      font-weight: 400;
    }
    .apple-subhead {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.2px;
      line-height: 20px;
      fill: #a1a1a6;
    }
    .bento-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #86868b;
      text-transform: uppercase;
    }
    .bento-val {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      fill: #f5f5f7;
    }
    .bento-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 10px;
      fill: #6e6e73;
    }
  </style>

  <!-- Container Box: Apple Space Black Surface -->
  <rect width="1198" height="388" x="1" y="1" rx="18" fill="#000000" stroke="#2c2c2e" stroke-width="1.2" />

  <!-- Japanese Subtle Seigaiha Ripple Overlay -->
  <rect width="1198" height="388" x="1" y="1" rx="18" fill="url(#seigaihaGrid)" />

  <!-- Apple Neutral Dot Matrix -->
  <rect width="1198" height="388" x="1" y="1" rx="18" fill="url(#appleDotGrid)" />

  <!-- ==================== CRAZY JAPANESE ANIMATED YIN-YANG WATERMARK ==================== -->
  <!-- Outer Breathing Ensō Aura -->
  <g class="enso-breathe">
    <circle cx="600" cy="170" r="215" fill="none" stroke="#222226" stroke-width="1" stroke-dasharray="8 12" />
    <circle cx="600" cy="170" r="185" fill="none" stroke="#2a2a2e" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="600" cy="170" r="155" fill="none" stroke="#333336" stroke-width="1.5" />
  </g>

  <!-- Dual Counter-Rotating Japanese Zen Rings & Taijitu Core -->
  <g transform="translate(600, 170)" opacity="0.25">
    <!-- Outer Bagua Ring: Clockwise Slow Spin -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite" />
      <circle r="135" fill="none" stroke="#f5f5f7" stroke-width="1" stroke-dasharray="16 10" />
      <!-- 8 Sacred Bagua Trigram Marks -->
      <line x1="0" y1="-142" x2="0" y2="-130" stroke="#f5f5f7" stroke-width="2" />
      <line x1="0" y1="130" x2="0" y2="142" stroke="#f5f5f7" stroke-width="2" />
      <line x1="-142" y1="0" x2="-130" y2="0" stroke="#f5f5f7" stroke-width="2" />
      <line x1="130" y1="0" x2="142" y2="0" stroke="#f5f5f7" stroke-width="2" />
      <line x1="-100" y1="-100" x2="-92" y2="-92" stroke="#f5f5f7" stroke-width="2" />
      <line x1="92" y1="92" x2="100" y2="100" stroke="#f5f5f7" stroke-width="2" />
      <line x1="100" y1="-100" x2="92" y2="-92" stroke="#f5f5f7" stroke-width="2" />
      <line x1="-92" y1="92" x2="-100" y2="100" stroke="#f5f5f7" stroke-width="2" />
    </g>

    <!-- Orbiting Satellite Satellites (Yin/Yang Energy Particles) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="16s" repeatCount="indefinite" />
      <circle cx="120" cy="0" r="4.5" fill="#f5f5f7" />
      <circle cx="-120" cy="0" r="4.5" fill="#0d0d0f" stroke="#86868b" stroke-width="1.5" />
    </g>

    <!-- Inner Core Taijitu (Yin-Yang) Rotating Counter-Clockwise -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="20s" repeatCount="indefinite" />
      
      <!-- Outer Zen Boundary Ring -->
      <circle r="100" fill="#0d0d0f" stroke="#424246" stroke-width="1.8" />

      <!-- White Half of Yin-Yang (Yang) -->
      <path d="M 0 -100 A 100 100 0 0 1 0 100 A 50 50 0 0 1 0 0 A 50 50 0 0 0 0 -100 Z" fill="#f5f5f7" />

      <!-- Black Seed Dot in White Half -->
      <circle cx="0" cy="-50" r="13" fill="#0d0d0f" />

      <!-- White Seed Dot in Black Half -->
      <circle cx="0" cy="50" r="13" fill="#f5f5f7" />
    </g>
  </g>

  <!-- ==================== TOP APPLE STATUS PILL BAR ==================== -->
  <g class="gsap-fade">
    <rect x="390" y="30" width="420" height="28" rx="14" fill="#141416" stroke="#2e2e32" stroke-width="1" />
    <circle cx="412" cy="44" r="3.5" fill="#f5f5f7" />
    <circle cx="412" cy="44" r="7" fill="none" stroke="#86868b" stroke-width="1" class="beacon" />
    <text x="610" y="48" text-anchor="middle" class="apple-eyebrow">
      DEFENSE CYBER INTELLIGENCE &amp; AI SYSTEMS
    </text>
  </g>

  <!-- ==================== MAIN HEADLINE ==================== -->
  <g class="gsap-fade">
    <text x="600" y="130" text-anchor="middle" class="apple-headline">
      M Tejas Yadav <tspan class="apple-headline-silver">/ tejassxo</tspan>
    </text>

    <!-- Subheadline -->
    <text x="600" y="164" text-anchor="middle" class="apple-subhead">
      Offensive Cybersecurity (VAPT) · Cloud-Native AI Telemetry · Indian Army TGC Aspirant
    </text>
  </g>

  <!-- Hairline Divider -->
  <line x1="100" y1="202" x2="1100" y2="202" stroke="#242426" stroke-width="1" />

  <!-- ==================== 4 APPLE BENTO TELEMETRY TILES ==================== -->
  <g class="gsap-fade">
    <!-- TILE 01: TRAJECTORY -->
    <g>
      <rect x="60" y="255" width="252" height="88" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <circle cx="80" cy="277" r="3" fill="#f5f5f7" />
      <circle cx="80" cy="277" r="6" fill="none" stroke="#86868b" stroke-width="1" class="beacon" />
      <text x="96" y="281" class="bento-label">01 // TRAJECTORY &amp; CORPS</text>
      <text x="80" y="306" class="bento-val">Indian Army TGC</text>
      <text x="80" y="326" class="bento-sub">Corps of Signals / Defense Intel</text>
    </g>

    <!-- TILE 02: RESEARCH & VAPT -->
    <g>
      <rect x="336" y="255" width="252" height="88" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <circle cx="356" cy="277" r="3" fill="#f5f5f7" />
      <circle cx="356" cy="277" r="6" fill="none" stroke="#86868b" stroke-width="1" class="beacon" />
      <text x="372" y="281" class="bento-label">02 // RESEARCH &amp; VAPT</text>
      <text x="356" y="306" class="bento-val">Offensive VAPT &amp; OSINT</text>
      <text x="356" y="326" class="bento-sub">HackersGurukul (CRAI Mentored)</text>
    </g>

    <!-- TILE 03: CLOUD & SYSTEMS -->
    <g>
      <rect x="612" y="255" width="252" height="88" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <circle cx="632" cy="277" r="3" fill="#f5f5f7" />
      <circle cx="632" cy="277" r="6" fill="none" stroke="#86868b" stroke-width="1" class="beacon" />
      <text x="648" y="281" class="bento-label">03 // CLOUD &amp; SYSTEMS</text>
      <text x="632" y="306" class="bento-val">Real-Time Biometrics</text>
      <text x="632" y="326" class="bento-sub">CoreDefender AI (US) · AWS IoT</text>
    </g>

    <!-- TILE 04: DISCIPLINE -->
    <g>
      <rect x="888" y="255" width="252" height="88" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <circle cx="908" cy="277" r="3" fill="#f5f5f7" />
      <circle cx="908" cy="277" r="6" fill="none" stroke="#86868b" stroke-width="1" class="beacon" />
      <text x="924" y="281" class="bento-label">04 // DISCIPLINE &amp; DEGREE</text>
      <text x="908" y="306" class="bento-val">B.Tech CSE (AI &amp; ML)</text>
      <text x="908" y="326" class="bento-sub">Pre-Final Year Engineering</text>
    </g>
  </g>
</svg>
