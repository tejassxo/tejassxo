<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <!-- Apple Minimal Dot Matrix (Subtle Neutral Gray, Zero Green, Zero Neon) -->
    <pattern id="appleDotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#262629" />
    </pattern>
  </defs>

  <style>
    /* GSAP Fluid Opacity Fade In */
    @keyframes gsapFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes appleBreathing {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }

    .gsap-fade {
      animation: gsapFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .apple-pulse {
      animation: appleBreathing 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Apple SF Pro Typography System */
    .apple-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #86868b;
      text-transform: uppercase;
    }
    .apple-headline {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.8px;
      fill: #f5f5f7;
    }
    .apple-headline-silver {
      fill: #86868b;
      font-weight: 400;
    }
    .apple-subhead {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.2px;
      line-height: 20px;
      fill: #a1a1a6;
    }
    .bento-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #86868b;
      text-transform: uppercase;
    }
    .bento-val {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      fill: #f5f5f7;
    }
    .bento-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      font-size: 10px;
      fill: #6e6e73;
    }
  </style>

  <!-- Container Box: Apple Space Black Surface -->
  <rect width="1198" height="368" x="1" y="1" rx="18" fill="#000000" stroke="#2c2c2e" stroke-width="1.2" />

  <!-- Subtle Neutral Dot Grid -->
  <rect width="1198" height="368" x="1" y="1" rx="18" fill="url(#appleDotGrid)" />

  <!-- ==================== JAPANESE ZEN YIN-YANG ANIMATED WATERMARK ==================== -->
  <g transform="translate(600, 168)" opacity="0.22">
    <!-- Concentric Zen Ripple Rings (Karesansui / Rock Garden) -->
    <circle r="195" fill="none" stroke="#222225" stroke-width="0.8" stroke-dasharray="4 8" />
    <circle r="165" fill="none" stroke="#2a2a2e" stroke-width="1" />
    <circle r="140" fill="none" stroke="#333336" stroke-width="1.2" stroke-dasharray="6 6" />

    <!-- Continuous Rotating Zen Yin-Yang Symbol -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite" />
      
      <!-- Outer Zen Boundary Ring -->
      <circle r="110" fill="#0d0d0f" stroke="#3a3a3e" stroke-width="1.5" />

      <!-- White Half of Yin-Yang (Yang) -->
      <path d="M 0 -110 A 110 110 0 0 1 0 110 A 55 55 0 0 1 0 0 A 55 55 0 0 0 0 -110 Z" fill="#f5f5f7" />

      <!-- Black Seed Dot in White Half -->
      <circle cx="0" cy="-55" r="14" fill="#0d0d0f" />

      <!-- White Seed Dot in Black Half -->
      <circle cx="0" cy="55" r="14" fill="#f5f5f7" />
    </g>
  </g>

  <!-- ==================== TOP APPLE STATUS PILL BAR ==================== -->
  <g class="gsap-fade">
    <rect x="405" y="32" width="390" height="28" rx="14" fill="#141416" stroke="#2e2e32" stroke-width="1" />
    <circle cx="426" cy="46" r="3.5" fill="#f5f5f7" />
    <circle cx="426" cy="46" r="7" fill="none" stroke="#86868b" stroke-width="1" class="apple-pulse" />
    <text x="610" y="50" text-anchor="middle" class="apple-eyebrow">
      DEFENSE CYBER INTELLIGENCE &amp; AI SYSTEMS
    </text>
  </g>

  <!-- ==================== MAIN HEADLINE ==================== -->
  <g class="gsap-fade">
    <text x="600" y="128" text-anchor="middle" class="apple-headline">
      M Tejas Yadav <tspan class="apple-headline-silver">/ tejassxo</tspan>
    </text>

    <!-- Subheadline -->
    <text x="600" y="162" text-anchor="middle" class="apple-subhead">
      Offensive Cybersecurity (VAPT) · Cloud-Native AI Telemetry · Indian Army TGC Aspirant
    </text>
  </g>

  <!-- Hairline Divider -->
  <line x1="120" y1="196" x2="1080" y2="196" stroke="#242426" stroke-width="1" />

  <!-- ==================== 4 APPLE BENTO TELEMETRY TILES ==================== -->
  <g class="gsap-fade">
    <!-- TILE 01: TRAJECTORY -->
    <g>
      <rect x="60" y="246" width="252" height="84" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <text x="80" y="272" class="bento-label">01 // TRAJECTORY &amp; CORPS</text>
      <text x="80" y="294" class="bento-val">Indian Army TGC</text>
      <text x="80" y="314" class="bento-sub">Corps of Signals / Defense Intel</text>
    </g>

    <!-- TILE 02: RESEARCH & VAPT -->
    <g>
      <rect x="336" y="246" width="252" height="84" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <text x="356" y="272" class="bento-label">02 // RESEARCH &amp; VAPT</text>
      <text x="356" y="294" class="bento-val">Offensive VAPT &amp; OSINT</text>
      <text x="356" y="314" class="bento-sub">HackersGurukul (CRAI Mentored)</text>
    </g>

    <!-- TILE 03: CLOUD & SYSTEMS -->
    <g>
      <rect x="612" y="246" width="252" height="84" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <text x="632" y="272" class="bento-label">03 // CLOUD &amp; SYSTEMS</text>
      <text x="632" y="294" class="bento-val">Real-Time Biometrics</text>
      <text x="632" y="314" class="bento-sub">CoreDefender AI (US) · AWS IoT</text>
    </g>

    <!-- TILE 04: DISCIPLINE -->
    <g>
      <rect x="888" y="246" width="252" height="84" rx="14" fill="#121214" stroke="#2c2c2e" stroke-width="1" />
      <text x="908" y="272" class="bento-label">04 // DISCIPLINE &amp; DEGREE</text>
      <text x="908" y="294" class="bento-val">B.Tech CSE (AI &amp; ML)</text>
      <text x="908" y="314" class="bento-sub">Pre-Final Year Engineering</text>
    </g>
  </g>
</svg>
