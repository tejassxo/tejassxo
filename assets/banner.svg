<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- True Neutral Monochrome Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Subtle Pure White Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Pure Monochrome Hairline -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0" />
      <stop offset="30%" stop-color="#525252" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a3a3a3" stop-opacity="1" />
      <stop offset="70%" stop-color="#525252" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </linearGradient>

    <!-- Neutral Grid Pattern (Zero Blue / Zero Purple) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="0" r="1" fill="#444444" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #a3a3a3;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #e5e5e5;
      text-transform: uppercase;
    }
    .meta-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #737373;
    }
    .meta-val {
      fill: #e5e5e5;
      font-weight: 600;
    }
  </style>

  <!-- Container Box -->
  <rect width="1198" height="318" x="1" y="1" rx="16" fill="url(#bgGradient)" stroke="#262626" stroke-width="1.2" />
  
  <!-- Neutral Grid Overlay -->
  <rect width="1198" height="318" x="1" y="1" rx="16" fill="url(#grid)" />

  <!-- Center Ambient Glow -->
  <rect width="1198" height="318" x="1" y="1" rx="16" fill="url(#centerGlow)" />

  <!-- Top Accent Hairline -->
  <line x1="150" y1="1" x2="1050" y2="1" stroke="url(#hairline)" stroke-width="1.5" />

  <!-- Status Pill -->
  <g transform="translate(600, 52)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#141414" stroke="#333333" stroke-width="1" />
    <circle cx="-90" cy="0" r="3.5" fill="#ffffff" />
    <circle cx="-90" cy="0" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="10" y="4" text-anchor="middle" class="badge-text">STATUS · ONLINE &amp; ACTIVE</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="135" text-anchor="middle" class="title">M TEJAS YADAV</text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" class="subtitle">AI Systems Engineering  ·  Cybersecurity &amp; VAPT  ·  Indian Army TGC Aspirant</text>

  <!-- Divider Line -->
  <line x1="250" y1="215" x2="950" y2="215" stroke="#262626" stroke-width="1" />

  <!-- Telemetry / Core Focus Items -->
  <g transform="translate(600, 255)">
    <!-- Item 1 -->
    <g transform="translate(-360, 0)">
      <circle cx="-12" cy="-4" r="3" fill="#737373" />
      <text x="0" y="0" class="meta-text">EDUCATION: <tspan class="meta-val">B.Tech CSE (AI &amp; ML)</tspan></text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 0)">
      <circle cx="-12" cy="-4" r="3" fill="#737373" />
      <text x="0" y="0" text-anchor="middle" class="meta-text">EXPERIENCE: <tspan class="meta-val">HackersGurukul × CoreDefender AI</tspan></text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(360, 0)">
      <circle cx="-12" cy="-4" r="3" fill="#737373" />
      <text x="0" y="0" text-anchor="end" class="meta-text">MISSION: <tspan class="meta-val">Army Cyber Intelligence</tspan></text>
    </g>
  </g>
</svg>
