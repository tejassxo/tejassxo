<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b0e" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080a0d" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>

    <!-- Animated Pulse Line Gradient -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#71717a" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .mono-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #71717a;
      text-transform: uppercase;
    }
    .status-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #a1a1aa;
    }
    .node-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #71717a;
    }
    .node-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #f4f4f5;
    }
    .node-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      font-size: 12px;
      line-height: 16px;
      fill: #94a3b8;
    }
    .node-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      fill: #d4d4d8;
    }

    /* Subtle Animated Beam */
    @keyframes beamFlow {
      0% {
        stroke-dashoffset: 240;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* Node Status Blinking */
    @keyframes pulseFade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .beam-path {
      stroke-dasharray: 40 80;
      animation: beamFlow 4s linear infinite;
    }

    .pulse-glow {
      animation: pulseFade 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Main Container -->
  <rect width="1198" height="278" x="1" y="1" rx="14" fill="url(#panelBg)" stroke="#27272a" stroke-width="1.2" />
  <rect width="1198" height="278" x="1" y="1" rx="14" fill="url(#dotGrid)" />

  <!-- Top Bar -->
  <g transform="translate(32, 36)">
    <text x="0" y="0" class="mono-label">PIPELINE // SYSTEMS ARCHITECTURE &amp; SECURITY LIFECYCLE</text>
    
    <!-- Status indicator right -->
    <g transform="translate(1134, -4)">
      <circle cx="-135" cy="0" r="3.5" fill="#22c55e" />
      <circle cx="-135" cy="0" r="7" fill="none" stroke="#22c55e" stroke-width="1" class="pulse-glow" />
      <text x="-120" y="4" class="status-text">PIPELINE ACTIVE</text>
    </g>
  </g>

  <!-- Connector Rail Behind Cards -->
  <line x1="160" y1="145" x2="1040" y2="145" stroke="#27272a" stroke-width="2" stroke-dasharray="4 4" />
  <!-- Animated Pulse Beam -->
  <line x1="160" y1="145" x2="1040" y2="145" stroke="url(#pulseGradient)" stroke-width="2" class="beam-path" />

  <!-- ==================== NODE 1 ==================== -->
  <g transform="translate(32, 60)">
    <rect width="260" height="186" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="24" r="3" fill="#71717a" />
    <text x="32" y="28" class="node-num">STAGE 01</text>
    <text x="20" y="58" class="node-title">Recon &amp; OSINT</text>
    <text x="20" y="80" class="node-desc">Passive intelligence gathering,</text>
    <text x="20" y="98" class="node-desc">attack surface enumeration &amp;</text>
    <text x="20" y="116" class="node-desc">threat footprint analysis.</text>

    <!-- Bottom Tag Pill -->
    <rect x="18" y="142" width="224" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
    <text x="26" y="159" class="node-tag">Sherlock · theHarvester · Nmap</text>
  </g>

  <!-- ==================== NODE 2 ==================== -->
  <g transform="translate(324, 60)">
    <rect width="260" height="186" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="24" r="3" fill="#71717a" />
    <text x="32" y="28" class="node-num">STAGE 02</text>
    <text x="20" y="58" class="node-title">VAPT &amp; Auditing</text>
    <text x="20" y="80" class="node-desc">Web app penetration testing,</text>
    <text x="20" y="98" class="node-desc">OWASP Top 10 verification &amp;</text>
    <text x="20" y="116" class="node-desc">ethical exploit validation.</text>

    <!-- Bottom Tag Pill -->
    <rect x="18" y="142" width="224" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
    <text x="26" y="159" class="node-tag">BurpSuite · PTES · ZAP</text>
  </g>

  <!-- ==================== NODE 3 ==================== -->
  <g transform="translate(616, 60)">
    <rect width="260" height="186" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="24" r="3" fill="#71717a" />
    <text x="32" y="28" class="node-num">STAGE 03</text>
    <text x="20" y="58" class="node-title">AI &amp; Telemetry</text>
    <text x="20" y="80" class="node-desc">Cloud-native biometric streaming,</text>
    <text x="20" y="98" class="node-desc">serverless data pipelines &amp;</text>
    <text x="20" y="116" class="node-desc">anomaly detection models.</text>

    <!-- Bottom Tag Pill -->
    <rect x="18" y="142" width="224" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
    <text x="26" y="159" class="node-tag">AWS Amplify · React · API GW</text>
  </g>

  <!-- ==================== NODE 4 ==================== -->
  <g transform="translate(908, 60)">
    <rect width="260" height="186" rx="10" fill="url(#cardBg)" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="24" r="3" fill="#71717a" />
    <text x="32" y="28" class="node-num">STAGE 04</text>
    <text x="20" y="58" class="node-title">Defense Doctrine</text>
    <text x="20" y="80" class="node-desc">Cyber warfare intelligence,</text>
    <text x="20" y="98" class="node-desc">systems hardening &amp; strategic</text>
    <text x="20" y="116" class="node-desc">Indian Army TGC readiness.</text>

    <!-- Bottom Tag Pill -->
    <rect x="18" y="142" width="224" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
    <text x="26" y="159" class="node-tag">Army TGC · Signals · Defense</text>
  </g>
</svg>
